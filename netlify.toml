# Netlify — domínio único https://4seo.app
# Marketing (Next export) + App autenticado (Vite SPA) mesclados em deploy-out/
# Rotas SPA: scripts/merge-frontend-deploy.mjs gera deploy-out/_redirects no build.

[build]
  command = "npm run build:go-live"
  publish = "deploy-out"

[build.environment]
  NODE_VERSION = "20"
  # Conflito peerOptional: @base-ui/react quer date-fns@4; react-day-picker usa date-fns@3
  NPM_FLAGS = "--legacy-peer-deps"
  # Projeto é export estático + Vite SPA (deploy-out), não o Next Runtime do Netlify
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Variáveis obrigatórias no painel Netlify (Site settings → Environment variables):
# NEXT_PUBLIC_APP_URL=https://4seo.app
# NEXT_PUBLIC_API_URL=https://api.4seo.app
# VITE_SUPABASE_URL=https://<projeto>.supabase.co
# VITE_SUPABASE_PUBLISHABLE_KEY=<anon>
# VITE_API_BASE_URL=https://api.4seo.app/api
# VITE_MARKETING_URL=https://4seo.app
# VITE_AUTH_REDIRECT_URL=https://4seo.app/login
#
# Não existe VITE_API_URL. NEXT_PUBLIC_API_URL não leva /api;
# VITE_API_BASE_URL leva /api. Ver docs/go-live/DOMAINS.md.

# Segurança (CDN) — headers só afetam arquivos estáticos servidos pelo Netlify
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Assets com hash (Vite) — cache longo no browser; deploy invalida no CDN
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML (marketing Next + spa.html) — sempre revalidar no browser
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Painel admin (SPA). Complementa deploy-out/_redirects gerado no build.
[[redirects]]
  from = "/admin"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/spa.html"
  status = 200
