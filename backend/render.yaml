services:
  - type: web
    name: 4seo-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    numInstances: 1
    healthCheckPath: /api/health
    domains:
      - api.4seo.app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://4seo.app
      - key: BACKEND_URL
        value: https://api.4seo.app
      - key: CORS_ORIGINS
        value: https://4seo.app,https://www.4seo.app
      - key: GSC_CLIENT_ID
        sync: false
      - key: GSC_CLIENT_SECRET
        sync: false
      - key: GSC_REDIRECT_URI
        value: https://api.4seo.app/api/gsc/callback
      - key: SEARCHAPI_KEY
        sync: false
      - key: NUVEMSHOP_APP_ID
        sync: false
      - key: NUVEMSHOP_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: LOJAINTEGRADA_APP_KEY
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_BASE_URL
        value: https://api.asaas.com/v3
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: APP_PUBLIC_URL
        value: https://4seo.app
      - key: ENVIRONMENT
        value: production
      - key: DISABLE_API_DOCS
        value: "true"
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
